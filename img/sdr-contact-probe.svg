<text x="505" y="146" text-anchor="middle" fill="#222">SMA connector</text>
<text x="414" y="94" text-anchor="start" fill="#222">center</text>
<line x1="55" y1="200" x2="400" y2="200" stroke="#222" stroke-width="1.5"/>
<circle cx="400" cy="200" r="4" fill="#222"/>
<circle cx="50" cy="200" r="5" fill="#222"/>
<text x="30" y="228" text-anchor="start" fill="#222" font-weight="bold">Clip to nearby ground</text>
<text x="414" y="194" text-anchor="start" fill="#222">shield</text>
<text x="30" y="250" text-anchor="start" fill="#222">Low-level version: 820 pF (821) and 460 Ω, only on points with no DC.</text>
