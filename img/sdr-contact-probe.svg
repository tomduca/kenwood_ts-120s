<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260" font-family="Arial, Helvetica, sans-serif" font-size="13">
<title>Contact probe for SDR</title>
<rect width="680" height="260" fill="#ffffff"/>
