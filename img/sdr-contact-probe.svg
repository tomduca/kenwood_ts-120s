<text x="30" y="66" text-anchor="start" fill="#222" font-weight="bold">Tip</text>
<line x1="55" y1="100" x2="116" y2="100" stroke="#222" stroke-width="1.5"/>
<line x1="116" y1="82" x2="116" y2="118" stroke="#222" stroke-width="2"/>
<line x1="128" y1="82" x2="128" y2="118" stroke="#222" stroke-width="2"/>
<text x="96" y="140" text-anchor="start" fill="#222" font-weight="bold">Series C</text>
<text x="96" y="158" text-anchor="start" fill="#222">33 pF (marked 33)</text>
<line x1="128" y1="100" x2="210" y2="100" stroke="#222" stroke-width="1.5"/>
<rect x="210" y="88" width="70" height="24" rx="3" fill="none" stroke="#222" stroke-width="1.5"/>
<text x="215" y="76" text-anchor="start" fill="#222" font-weight="bold">Series R</text>
